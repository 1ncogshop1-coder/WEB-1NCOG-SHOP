<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1NCOG CHEATS | OFFICIAL STORE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300;700&display=swap');

:root{
--cyan:#00f2ff;
--bg:#020205;
--red:#ff003c;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:var(--bg);
color:white;
font-family:'JetBrains Mono', monospace;
overflow-x:hidden;
}

#canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
opacity:0.15;
}

/* TIENDA */

#main-content{
opacity:1;
padding-bottom:80px;
}

.header{
padding:80px 20px;
text-align:center;
}

.header h1{
font-family:'Orbitron';
font-size:clamp(1.8rem,10vw,4rem);
letter-spacing:8px;
color:#fff;
text-shadow:0 0 30px var(--cyan);
}

.container{
max-width:1300px;
margin:0 auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.01);
border:1px solid #111;
padding:20px;
position:relative;
text-align:center;
transition:0.5s;
}

.card:hover{
border-color:var(--cyan);
background:rgba(0,242,255,0.02);
transform:translateY(-5px);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
margin-bottom:20px;
border-radius:2px;
filter:grayscale(30%);
transition:0.5s;
}

.card:hover img{
filter:grayscale(0%);
}

.price{
position:absolute;
top:30px;
right:30px;
background:var(--cyan);
color:#000;
padding:6px 15px;
font-weight:900;
font-family:'Orbitron';
font-size:14px;
box-shadow:0 0 15px rgba(0,242,255,0.3);
}

/* MODAL */

#buy-modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.98);
z-index:10000;
justify-content:center;
align-items:center;
backdrop-filter:blur(5px);
}

.modal-content{
width:95%;
max-width:550px;
background:#05050a;
border:1px solid var(--cyan);
padding:30px;
position:relative;
}

.modal-video{
width:100%;
aspect-ratio:16/9;
background:#000;
margin:20px 0;
border:1px solid #1a1a1a;
}

video{
width:100%;
height:100%;
box-shadow:0 0 20px rgba(0,242,255,0.1);
}

.close-modal{
position:absolute;
top:15px;
right:20px;
color:var(--cyan);
font-size:35px;
cursor:pointer;
opacity:0.7;
transition:0.3s;
}

.close-modal:hover{
opacity:1;
transform:rotate(90deg);
}

.seller-btns{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.btn-main{
width:100%;
padding:16px;
background:var(--cyan);
color:#000;
border:none;
font-family:'Orbitron';
font-weight:900;
cursor:pointer;
text-transform:uppercase;
margin-top:15px;
transition:0.4s;
letter-spacing:2px;
}

.btn-main:hover{
background:#fff;
box-shadow:0 0 25px var(--cyan);
transform:translateY(-2px);
}

.btn-v{
padding:18px;
border:none;
font-family:'Orbitron';
font-weight:900;
cursor:pointer;
color:#fff;
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
transition:0.3s;
}

.v1{
background:#0055ff;
}

.v2{
background:#0033aa;
}

.btn-v:hover{
transform:scale(1.05);
filter:brightness(1.2);
}
</style>
</head>

<body>

</div>

<div class="card">

onclick="openBuy('DRIP CLIENT','https://www.dropbox.com/scl/fi/okal3ygsnlln62rivofqp/VID-20260405-WA0070.mp4?rlkey=wua1qz95mhwtf8936srd21iri&st=bckovp86&raw=1')">

</div>

<div class="card">

</div>

<script>

// MODAL

let currentProduct="";

function openBuy(name,vid){

currentProduct=name;

document.getElementById('modal-title').innerText=name;

const player=document.getElementById('v-player');

player.src=vid;

player.play();

document.getElementById('buy-modal').style.display='flex';
}

function closeBuy(){

document.getElementById('buy-modal').style.display='none';

document.getElementById('v-player').pause();
}

function contact(v){

const num=(v===1)
? "56920012710"
: "66864178102";

window.open(
`https://wa.me/${num}?text=Hola,%20vengo%20de%20la%20tienda%20oficial.%20Quiero%20información%20sobre:%20${currentProduct}`,
'_blank'
);
}

// MATRIX EFFECT

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const cols=Array(Math.floor(canvas.width/20)).fill(1);

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00f2ff";
ctx.font="15px monospace";

cols.forEach((y,i)=>{

ctx.fillText(
Math.floor(Math.random()*2),
i*20,
y*20
);

if(y*20>canvas.height && Math.random()>0.975){
cols[i]=0;
}

cols[i]++;
});
}

setInterval(draw,50);

</script>
